<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel tuner</title>
<!-- Live tuning of the baked result: `npm run serve`, then http://127.0.0.1:8765/tools/tune.html (?scene=/path/scene.json).
     The server renders with scripts/tune-api.js; view settings re-render, bake settings bake a cached variant. The sliders
     come from tune-controls.mjs, shared with compare.html. -->
<style>
  :root { --bg: #14151a; --panel: #1c1e24; --line: #2c2f38; --text: #e4e4e7; --muted: #9a9ca6; --accent: #9fd0ff; --good: #8fd18f; --bad: #e8a08a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: 320px 1fr; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 20px; }
  main { display: flex; flex-direction: column; min-width: 0; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  #scene, button { width: 100%; background: #26282f; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .stage { flex: 1; display: grid; place-items: center; overflow: auto; padding: 16px; background: #0b0d10; position: relative; }
  .stage img { image-rendering: pixelated; display: block; }
  .busy { position: absolute; top: 10px; right: 14px; color: var(--accent); font-size: 12px; opacity: 0; transition: opacity 0.15s; }
  .busy.on { opacity: 1; }
  .bar { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar b { color: var(--text); font-weight: 600; }
  .good { color: var(--good) !important; }
  .bad { color: var(--bad) !important; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .error { color: #ffb4a8; padding: 16px; }
  code { color: var(--accent); }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<aside>
  <h1>Pixel tuner</h1>
  <select id="scene"></select>
  <div id="controls"></div>
  <div class="buttons"><button id="reset">Reset</button><button id="save">Save tuned scene</button></div>
  <p class="hint" id="saved">Changed settings are blue. Unchanged ones keep the scene's own values.</p>
</aside>
<main>
  <div class="stage"><img id="image" alt=""><span class="busy" id="busy">rendering…</span></div>
  <div class="bar" id="bar">loading…</div>
</main>
<script>
  if (location.protocol === 'file:')
    document.body.innerHTML = '<p class="error">This page has to be served. Run <code>npm run serve</code> and open <code>http://127.0.0.1:8765/tools/tune.html</code>.</p>';
</script>
<script type="module">
import { buildControls, renderTuned, saveTuned, STYLE } from './tune-controls.mjs';
document.head.insertAdjacentHTML('beforeend', `<style>${STYLE}</style>`);

const tuner = buildControls(document.getElementById('controls'), () => schedule());
const sceneSelect = document.getElementById('scene');
const list = await (await fetch('/api/scenes')).json();
const wanted = new URLSearchParams(location.search).get('scene');
if (wanted && !list.some(s => s.scene === wanted)) list.unshift({ label: wanted, scene: wanted });
let lastGroup, group;
for (const s of list) {
  if (s.group !== lastGroup) {
    group = document.createElement('optgroup');
    group.label = s.group ?? 'Scenes';
    sceneSelect.append(group);
    lastGroup = s.group;
  }
  group.insertAdjacentHTML('beforeend', `<option value="${s.scene}">${s.label}</option>`);
}
if (!list.length) document.getElementById('bar').textContent = 'No scenes: run node scripts/compare-models.js, or open with ?scene=/path/scene.json';
if (wanted) sceneSelect.value = wanted;
/* settings handed over in the URL (compare.html links here with its current ones) */
const handed = new URLSearchParams(location.search).get('settings');
if (handed) for (const [key, value] of Object.entries(JSON.parse(handed))) if (key !== 'res' || value !== 'auto') tuner.set(key, value);
sceneSelect.addEventListener('change', () => { cameraKnown = false; schedule(0); });

let timer = null, requestId = 0, cameraKnown = false;
function schedule(delay = 120) {
  clearTimeout(timer);
  timer = setTimeout(render, delay);
}
const image = document.getElementById('image'), bar = document.getElementById('bar'), busy = document.getElementById('busy');
async function render() {
  if (!sceneSelect.value) return;
  const id = ++requestId;
  busy.classList.add('on');
  let result;
  try {
    result = await renderTuned(sceneSelect.value, tuner.settings());
  } catch (error) {
    if (id === requestId) (busy.classList.remove('on'), (bar.innerHTML = `<span class="bad">${error.message}</span>`));
    return;
  }
  if (id !== requestId) return; /* a newer request is on its way */
  busy.classList.remove('on');
  image.src = 'data:image/png;base64,' + result.image;
  image.dataset.w = result.width;
  image.dataset.h = result.height;
  fit();
  /* show the scene's own camera and the spacing it resolved to, without marking them changed */
  if (!cameraKnown && result.resolved.camera?.yaw !== undefined) {
    cameraKnown = true;
    if (!tuner.isDirty('yaw')) tuner.set('yaw', result.resolved.camera.yaw, { quiet: true });
    if (!tuner.isDirty('pitch')) tuner.set('pitch', result.resolved.camera.pitch, { quiet: true });
  }
  const m = result.metrics, ref = m.reference ?? {};
  const grade = (v, r) => `<b class="${v <= r * 1.25 ? 'good' : 'bad'}">${v}</b>`;
  bar.innerHTML = [
    `art <b>${result.width} × ${result.height}</b>`, `noise ${grade(m.noise, ref.noise)} <small>(ref ${ref.noise})</small>`,
    `orphans ${grade(m.orphans, ref.orphans)} <small>(ref ${ref.orphans})</small>`, `jaggies <b>${m.jaggies}</b>`,
    `tones <b>${String(m.tones).toLowerCase().replace('_', ' ')}</b>`, `colours <b>${m.colours}</b>`,
    `splats <b>${m.splats.toLocaleString()}</b>`, `spacing <b>${result.resolved.res}</b>`,
    `bake <b>${result.timings.cached ? 'cached' : result.timings.bakeMs + ' ms'}</b>`, `draw <b>${result.timings.drawMs} ms</b>`
  ].map(s => `<span>${s}</span>`).join('');
}
/* the largest whole-number scale that fits, so art pixels stay square and equal */
function fit() {
  const stage = image.parentElement, w = +image.dataset.w, h = +image.dataset.h;
  if (!w) return;
  const k = Math.max(1, Math.floor(Math.min((stage.clientWidth - 32) / w, (stage.clientHeight - 32) / h)));
  image.style.width = w * k + 'px';
  image.style.height = h * k + 'px';
}
addEventListener('resize', fit);

document.getElementById('reset').addEventListener('click', () => {
  tuner.reset();
  cameraKnown = false;
  schedule(0);
});
document.getElementById('save').addEventListener('click', async () => {
  const note = document.getElementById('saved');
  try {
    const result = await saveTuned(sceneSelect.value, tuner.settings());
    note.innerHTML = `Saved <code>${result.file}</code>. Render it at ${result.render.size.w} × ${result.render.size.h} (pixelSize 1).`;
  } catch (error) {
    note.innerHTML = `<span class="bad">${error.message}</span>`;
  }
});
schedule(0);
document.body.dataset.ready = '1';
</script>
</body>
</html>

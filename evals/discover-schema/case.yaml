schema_version: "1.1"
name: discover-schema
description: Find a solid kind and its required fields through the discovery tools.
tags: [smoke, discovery]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Using the ink-studio tools (MCP, or the `ink-agent` shell command if they are not available), find out which solid kind
    in an ink-studio diorama makes a torus and which fields it requires. Answer in one line in the form `kind: field, field, ...`.
    In this workspace the shell command is `./ink-agent` (the sandbox cannot run the plugin's own copy).
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: used-discovery
    type: tool_used
    tool: Bash
    input_match: 'ink-agent call ink_discover'
  - name: names-torus
    type: regex
    pattern: 'torus'
    flags: i
  - name: names-fields
    type: regex
    pattern: '`?\bat\b`?[^\n]*`?\bR\b`?[^\n]*`?\br\b`?|`?\bR\b`?[^\n]*`?\br\b`?[^\n]*`?\bat\b`?'
